<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>明光義塾のご案内</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #canvas-container {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    display: block;
    touch-action: none;
  }

  #ui {
    width: 100%;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .nav-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 24px;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:active { background: rgba(255,255,255,0.35); }
  .nav-btn:disabled { opacity: 0.25; pointer-events: none; }

  #dots {
    display: flex;
    gap: 7px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 70%;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.25s;
    cursor: pointer;
  }
  .dot.active {
    background: #4fc3f7;
    transform: scale(1.4);
  }

  #loading {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="canvas-container">
  <div id="loading">
    <div class="spinner"></div>
    <span>読み込み中...</span>
  </div>
  <canvas id="pdf-canvas" style="display:none;"></canvas>
</div>

<div id="ui">
  <button class="nav-btn" id="prev" disabled>&#8249;</button>
  <div id="dots"></div>
  <button class="nav-btn" id="next" disabled>&#8250;</button>
</div>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = '/counseling.pdf';
  const canvas = document.getElementById('pdf-canvas');
  const ctx = canvas.getContext('2d');
  const loading = document.getElementById('loading');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const dotsEl = document.getElementById('dots');

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let rendering = false;

  // タッチ操作
  let touchStartX = 0, touchStartY = 0;

  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 10 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < -50 && currentPage < totalPages) goTo(currentPage + 1);
    else if (dx > 50 && currentPage > 1) goTo(currentPage - 1);
  }, { passive: true });

  // キーボード
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(currentPage + 1);
    if (e.key === 'ArrowLeft') goTo(currentPage - 1);
  });

  function renderPage(num) {
    if (rendering) return;
    rendering = true;

    pdfDoc.getPage(num).then(page => {
      const container = document.getElementById('canvas-container');
      const maxW = container.clientWidth;
      const maxH = container.clientHeight;

      const viewport0 = page.getViewport({ scale: 1 });
      const scale = Math.min(maxW / viewport0.width, maxH / viewport0.height);
      const viewport = page.getViewport({ scale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      page.render({ canvasContext: ctx, viewport }).promise.then(() => {
        rendering = false;
        loading.style.display = 'none';
        canvas.style.display = 'block';
        updateUI();
      });
    });
  }

  function goTo(num) {
    if (num < 1 || num > totalPages || rendering) return;
    currentPage = num;
    renderPage(currentPage);
  }

  function updateUI() {
    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i + 1 === currentPage);
    });
  }

  // PDF読み込み
  pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
    pdfDoc = pdf;
    totalPages = pdf.numPages;

    // ドット生成
    for (let i = 1; i <= totalPages; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    }

    prevBtn.disabled = false;
    nextBtn.disabled = false;
    renderPage(1);
  }).catch(err => {
    loading.innerHTML = '<span style="color:#ff6b6b;">PDFの読み込みに失敗しました</span>';
    console.error(err);
  });

  prevBtn.addEventListener('click', () => goTo(currentPage - 1));
  nextBtn.addEventListener('click', () => goTo(currentPage + 1));

  // リサイズ対応
  window.addEventListener('resize', () => {
    if (pdfDoc) renderPage(currentPage);
  });
</script>
</body>
</html>
