<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f4f0;min-height:100vh;color:#1a1a1a}
.app{max-width:640px;margin:0 auto;padding:0 0 3rem}
.screen{display:none}.screen.active{display:block}
#screen-role{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
#screen-role.active{display:flex}
.app-logo{font-size:12px;letter-spacing:.15em;color:#aaa;margin-bottom:2rem;text-transform:uppercase}
.role-heading{font-size:24px;font-weight:700;margin-bottom:6px;text-align:center}
.role-sub{font-size:14px;color:#888;margin-bottom:2rem;text-align:center}
.role-cards{display:flex;gap:16px;width:100%;max-width:440px}
.role-card{flex:1;background:#fff;border:1.5px solid #e8e6e0;border-radius:16px;padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.role-card:hover{border-color:#888;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.role-card i{font-size:30px;color:#555;margin-bottom:10px;display:block}
.role-card .rc-label{font-size:17px;font-weight:700;margin-bottom:4px}
.role-card .rc-sub{font-size:12px;color:#888}
.tutor-link-list{width:100%;max-width:440px;margin-top:.5rem}
.tutor-link-item{background:#fff;border:1px solid #e8e6e0;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;padding:12px 16px;gap:12px}
.tutor-link-item .tl-name{font-size:14px;font-weight:500;flex:1;white-space:nowrap}
.tutor-link-item .tl-url{font-size:11px;color:#aaa;word-break:break-all;flex:2}
.copy-btn{background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:#555;white-space:nowrap;font-family:inherit}
.copy-btn:hover{background:#f0efeb}
.divider-or{text-align:center;color:#aaa;font-size:12px;margin:1rem 0;position:relative}
.divider-or::before{content:'';position:absolute;left:0;top:50%;width:40%;height:1px;background:#e0e0e0}
.divider-or::after{content:'';position:absolute;right:0;top:50%;width:40%;height:1px;background:#e0e0e0}
.hdr{display:flex;align-items:center;gap:10px;padding:1.25rem 1.25rem .25rem}
.back-btn{background:none;border:1px solid #ddd;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;color:#555;display:flex;align-items:center;gap:4px;font-family:inherit}
.back-btn:hover{background:#f0efeb}
.hdr-title{font-size:17px;font-weight:700;flex:1}
.role-pill{font-size:12px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid #e0e0e0;color:#555;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tabs{display:flex;gap:3px;padding:.75rem 1.25rem;background:#f5f4f0;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:8px;border:1px solid #ddd;background:#fff;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#888;font-family:'Noto Sans JP',sans-serif;transition:background .12s,color .12s,border-color .12s}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.content{padding:0 1.25rem}
.tab-pane{display:none;padding-top:1rem}.tab-pane.active{display:block}
.sec-label{font-size:11px;letter-spacing:.1em;color:#999;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.tutor-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.tutor-row label{font-size:13px;color:#666;white-space:nowrap}
select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-nav button{background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:#555;font-family:inherit}
.cal-nav button:hover{background:#f0efeb}
.cal-month{font-size:15px;font-weight:700;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;color:#aaa;padding-bottom:4px;font-weight:500}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;font-size:13px;cursor:pointer;color:#1a1a1a;border:1.5px solid transparent;transition:background .1s}
.cal-day:hover:not(.empty):not(.other){background:#f0efeb}
.cal-day.selected{background:#1a1a1a;color:#fff}
.cal-day.empty,.cal-day.other{cursor:default;color:#ccc}
.cal-dot{width:5px;height:5px;border-radius:50%;background:#888;flex-shrink:0}
.cal-day.selected .cal-dot{background:#ccc}
.slot-wrap{margin-top:1rem;background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:1rem 1.25rem}
.slot-wrap-title{font-size:14px;font-weight:700;margin-bottom:12px}

/* 時間帯＋勤務地の行 */
.slot-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0efeb}
.slot-row:last-of-type{border-bottom:none}
.slot-time{font-size:13px;min-width:120px;color:#1a1a1a}
.slot-time.disabled{color:#bbb}
.loc-btns{display:flex;gap:6px;flex-wrap:wrap}
.loc-btn{padding:5px 12px;border-radius:99px;border:1.5px solid #ddd;font-size:12px;cursor:pointer;background:#fff;font-family:inherit;color:#555;transition:background .1s,border-color .1s}
.loc-btn:hover:not(.locked){background:#f0efeb}
.loc-btn.sel{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.loc-btn.locked{cursor:default;opacity:.7}

/* ステータス色 */
.slot-row.st-pending .slot-time{color:#633806}
.slot-row.st-pending .loc-btn.sel{background:#EF9F27;border-color:#EF9F27;color:#fff}
.slot-row.st-accepted .slot-time{color:#1a3a08}
.slot-row.st-accepted .loc-btn.sel{background:#639922;border-color:#639922;color:#fff}
.slot-row.st-rejected .slot-time{color:#aaa;text-decoration:line-through}
.slot-row.st-rejected .loc-btn.sel{background:#ddd;border-color:#ddd;color:#888}

/* ステータスバッジ（行末） */
.slot-status{font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap;margin-left:auto}
.ss-pending{background:#FAEEDA;color:#633806}
.ss-accepted{background:#EAF3DE;color:#1a3a08}
.ss-rejected{background:#FCEBEB;color:#500}
.ss-ab-pending{background:#FBEAF0;color:#4B1528}
.ss-ab-accepted{background:#EAF3DE;color:#1a3a08}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.leg-dot{width:9px;height:9px;border-radius:50%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;color:#1a1a1a;transition:background .1s;font-weight:500}
.btn:hover{background:#f0efeb}
.btn.primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.btn.primary:hover{background:#333}
.btn.success{background:#EAF3DE;border-color:#639922;color:#1a3a08}
.btn.success:hover{background:#C0DD97}
.btn.danger{background:#FCEBEB;border-color:#E24B4A;color:#500}
.btn.danger:hover{background:#F7C1C1}
.req-list{display:flex;flex-direction:column;gap:10px}
.req-item{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:12px 14px}
.ri-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ri-label{font-size:14px;font-weight:500;flex:1}
.ri-loc{font-size:12px;color:#555;background:#f0efeb;padding:2px 8px;border-radius:99px}
.badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:500}
.badge.pending{background:#FAEEDA;color:#633806}
.badge.accepted{background:#EAF3DE;color:#1a3a08}
.badge.rejected{background:#FCEBEB;color:#500}
.badge.ab-pending{background:#FBEAF0;color:#4B1528}
.sch-list{display:flex;flex-direction:column}
.sch-item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #f0efeb;flex-wrap:wrap}
.sch-item:first-child{border-radius:12px 12px 0 0}
.sch-item:last-child{border-radius:0 0 12px 12px;border-bottom:none}
.sch-date{font-size:13px;font-weight:700;min-width:80px}
.sch-name{font-size:13px;color:#555;min-width:80px}
.sch-time{font-size:12px;color:#777;flex:1}
.sch-loc{font-size:12px;background:#f0efeb;padding:2px 8px;border-radius:99px;color:#444}
.sch-badge{font-size:11px;padding:2px 9px;border-radius:99px}
.sb-work{background:#EAF3DE;color:#1a3a08}
.sb-abs{background:#FBEAF0;color:#4B1528}
/* 確定予定カレンダー */
.sch-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:4px;width:100%}
.sch-cal-dow{text-align:center;font-size:10px;color:#aaa;padding-bottom:4px;font-weight:500}
.sch-cal-day{min-height:58px;border-radius:6px;padding:3px 2px;background:#fff;border:1px solid #f0efeb;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.sch-cal-day.empty{background:transparent;border-color:transparent}
.sch-cal-day .scd-num{font-size:10px;font-weight:700;color:#888;margin-bottom:1px;line-height:1}
.sch-cal-day.today .scd-num{color:#fff;background:#1a1a1a;border-radius:99px;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.sch-cal-entry{font-size:10px;border-radius:3px;padding:2px 3px;line-height:1.4;display:flex;flex-direction:row;align-items:center;justify-content:space-between;overflow:hidden;gap:2px}
.sch-cal-entry .sct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sch-cal-entry .scl{font-weight:700;white-space:nowrap;flex-shrink:0}
.sce-work{background:#EAF3DE;color:#1a3a08}
.sce-abs{background:#FBEAF0;color:#4B1528}
.scl-yashiro{color:#cc0000;font-weight:700}
.scl-aoki{color:#0055cc;font-weight:700}
.scl-amori{color:#1a1a1a;font-weight:700}

.empty{text-align:center;padding:2.5rem;color:#aaa;font-size:14px}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;white-space:nowrap}
.toast.show{opacity:1}
.sync-indicator{font-size:11px;color:#aaa;text-align:right;padding:.25rem 1.25rem 0}

/* 欠勤用スロット（シンプル） */
.abs-slots{display:flex;flex-direction:column;gap:0}
.abs-slot-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0efeb}
.abs-slot-row:last-child{border-bottom:none}
.abs-slot-time{font-size:13px;flex:1}
.abs-chk{width:18px;height:18px;cursor:pointer;accent-color:#1a1a1a}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div class="app">

<!-- ロール選択 -->
<div class="screen active" id="screen-role">
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem">
    <div class="app-logo">Shift Manager</div>
    <div class="role-heading">シフト管理</div>
    <div class="role-sub">どちらの立場で使いますか？</div>
    <div class="role-cards">
      <div class="role-card" onclick="setRole('juku')">
        <i class="ti ti-building-store"></i>
        <div class="rc-label">塾側</div>
        <div class="rc-sub">勤務依頼・欠勤承認</div>
      </div>
      <div class="role-card" onclick="showTutorLinks()">
        <i class="ti ti-user-circle"></i>
        <div class="rc-label">講師リンク</div>
        <div class="rc-sub">各講師の専用URLを確認</div>
      </div>
    </div>
    <div id="tutor-links-section" style="display:none;width:100%;max-width:440px;margin-top:1.5rem">
      <div class="divider-or">講師別専用リンク</div>
      <div class="tutor-link-list" id="tutor-link-list"></div>
    </div>
  </div>
</div>

<!-- 塾側 -->
<div class="screen" id="screen-juku">
  <div class="hdr">
    <button class="back-btn" onclick="goRole()"><i class="ti ti-arrow-left"></i></button>
    <span class="hdr-title">シフト管理</span>
    <div class="role-pill"><i class="ti ti-building-store" style="font-size:13px"></i> 塾側</div>
  </div>
  <div class="sync-indicator" id="juku-sync"></div>
  <div class="tabs">
    <button class="tab active" id="jtab-request" onclick="jSwitch('request')">勤務依頼</button>
    <button class="tab" id="jtab-absence" onclick="jSwitch('absence')">欠勤承認</button>
    <button class="tab" id="jtab-schedule" onclick="jSwitch('schedule')">確定予定</button>
  </div>
  <div class="content">
    <div class="tab-pane active" id="jpane-request">
      <div class="tutor-row">
        <label>対象講師：</label>
        <select id="juku-tutor" onchange="renderJukuSlots()"><option value="">選択してください</option></select>
      </div>
      <div class="sec-label">日付を選択</div>
      <div class="cal-nav">
        <button onclick="cm(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="cal-month" id="cal-lbl"></span>
        <button onclick="cm(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="jcal"></div>
      <div id="jslot-wrap" style="display:none" class="slot-wrap">
        <div class="slot-wrap-title" id="jslot-title"></div>
        <div class="legend">
          <div class="leg"><div class="leg-dot" style="background:#EF9F27"></div>依頼中</div>
          <div class="leg"><div class="leg-dot" style="background:#639922"></div>承諾済み</div>
          <div class="leg"><div class="leg-dot" style="background:#E24B4A"></div>拒否済み</div>
        </div>
        <div id="jslots"></div>
        <div class="btn-row">
          <button class="btn primary" onclick="sendRequest()"><i class="ti ti-send"></i> 依頼を送る</button>
        </div>
      </div>
    </div>
    <div class="tab-pane" id="jpane-absence">
      <div class="sec-label">講師からの欠勤申請</div>
      <div class="req-list" id="jabs-list"></div>
    </div>
    <div class="tab-pane" id="jpane-schedule">
      <div class="sec-label">確定済みシフト一覧</div>
      <div id="jsch-list"></div>
    </div>
  </div>
</div>

<!-- 講師側 -->
<div class="screen" id="screen-tutor">
  <div class="hdr">
    <div style="display:flex;flex-direction:column;flex:1">
      <span class="hdr-title" id="tutor-hdr-name"></span>
      <span style="font-size:12px;color:#aaa;margin-top:1px">講師専用ページ</span>
    </div>
    <div class="role-pill"><i class="ti ti-user-circle" style="font-size:13px"></i> 講師</div>
  </div>
  <div class="sync-indicator" id="tutor-sync"></div>
  <div class="tabs">
    <button class="tab active" id="ttab-requests" onclick="tSwitch('requests')">塾からの依頼</button>
    <button class="tab" id="ttab-absence" onclick="tSwitch('absence')">欠勤申請</button>
    <button class="tab" id="ttab-schedule" onclick="tSwitch('schedule')">確定予定</button>
  </div>
  <div class="content">
    <div class="tab-pane active" id="tpane-requests">
      <div class="req-list" id="treq-list"></div>
    </div>
    <div class="tab-pane" id="tpane-absence">
      <div class="sec-label">欠勤希望日を選択</div>
      <div class="cal-nav">
        <button onclick="cm2(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="cal-month" id="cal-lbl2"></span>
        <button onclick="cm2(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="tcal"></div>
      <div id="tslot-wrap" style="display:none" class="slot-wrap">
        <div class="slot-wrap-title" id="tslot-title"></div>
        <div class="legend">
          <div class="leg"><div class="leg-dot" style="background:#D4537E"></div>申請中</div>
          <div class="leg"><div class="leg-dot" style="background:#639922"></div>承認済み</div>
        </div>
        <div class="abs-slots" id="tabs-slots"></div>
        <div class="btn-row">
          <button class="btn danger" onclick="sendAbsence()"><i class="ti ti-calendar-off"></i> 欠勤申請を送る</button>
        </div>
      </div>
    </div>
    <div class="tab-pane" id="tpane-schedule">
      <div class="cal-nav">
        <button onclick="cm3(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="cal-month" id="cal-lbl3"></span>
        <button onclick="cm3(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="sch-cal-grid" id="tsch-cal"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://shift-api.kobetsu-meiko.workers.dev';

// EmailJS設定
emailjs.init('EiSv0T7EF_8vii917');

async function sendShiftNotification(eventType, tutorName, date, slot, location=''){
  try {
    await emailjs.send('service_snmdm3c', 'template_x1uds2z', {
      notification_type: 'シフト通知',
      student_name: '',
      date_label: '',
      time_label: '',
      memo: '',
      booking_id: '',
      tutor_name: tutorName,
      event_type: eventType,
      shift_date: date ? fd(date) : '',
      shift_slot: slot || '',
      shift_location: location || '',
    });
  } catch(e) {
    console.error('メール送信エラー:', e);
  }
}
const TUTORS = [
  { id: 'asamura',    name: '浅村結良' },
  { id: 'koyama',     name: '小山陽樹' },
  { id: 'watanuki',   name: '綿貫心暖' },
  { id: 'takazawa',   name: '高澤雅樹' },
  { id: 'miyazaki',   name: '宮崎久仁子' },
  { id: 'midorikawa', name: '緑川智洸' },
];
const SLOTS = ['9:00〜10:30','10:40〜12:10','13:10〜14:40','14:50〜16:20','16:30〜18:00','18:10〜19:40','19:50〜21:20'];
const LOCS  = ['屋代','安茂里','青木島'];

// requests[date][tutor][slot] = { status:'pending'|'accepted'|'rejected', location:'屋代'|'安茂里'|'青木島' }
// absences[date][tutor][slot] = 'absence-pending'|'absence-accepted'
let requests = {}, absences = {};
let role = null, currentTutor = null;
let cY, cM, cY2, cM2;
let jDate = null, tDate = null;
// jSel[slot] = location|null
let jSel = {};
let tSel = new Set();

function dk(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}` }
function fd(k){ const[,m,d]=k.split('-'); return `${parseInt(m)}月${parseInt(d)}日` }
function gs(id){ return document.getElementById(id) }
function show(id,v=true){ gs(id).classList.toggle('active',v) }
function toast(msg){ const t=gs('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200) }
function setSyncLabel(id,msg){ const el=gs(id); if(el) el.textContent=msg }

// ===== API =====
async function loadData(){
  try{
    const res=await fetch(`${API}/data`);
    const data=await res.json();
    requests=data.requests||{};
    absences=data.absences||{};
  }catch(e){ toast('通信エラー：データを取得できませんでした') }
}
async function saveRequests(){
  try{ await fetch(`${API}/data`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests})}) }
  catch(e){ toast('通信エラー：保存できませんでした') }
}
async function saveAbsences(){
  try{ await fetch(`${API}/data`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({absences})}) }
  catch(e){ toast('通信エラー：保存できませんでした') }
}

// ===== 起動時 =====
window.addEventListener('DOMContentLoaded', async ()=>{
  const params=new URLSearchParams(location.search);
  const tid=params.get('tutor');
  if(tid){
    // 講師URLの場合は最初からロール選択画面を隠す
    show('screen-role', false);
    const found=TUTORS.find(t=>t.id===tid);
    if(found){ await autoLoginTutor(found); return }
    // IDが一致しない場合は戻す
    show('screen-role', true);
  }
});

async function autoLoginTutor(tutor){
  currentTutor=tutor.name;
  gs('tutor-hdr-name').textContent=tutor.name;
  const n=new Date(); cY2=n.getFullYear(); cM2=n.getMonth();
  setSyncLabel('tutor-sync','読み込み中...');
  await loadData();
  setSyncLabel('tutor-sync','');
  renderCal2(); renderTReqs(); renderTSch();
  show('screen-role',false); show('screen-tutor');
}

// ===== ロール選択 =====
async function setRole(r){
  role=r;
  const sel=gs('juku-tutor');
  sel.innerHTML='<option value="">選択してください</option>';
  TUTORS.forEach(t=>{ const o=document.createElement('option'); o.value=t.name; o.textContent=t.name; sel.appendChild(o) });
  const n=new Date(); cY=n.getFullYear(); cM=n.getMonth();
  setSyncLabel('juku-sync','読み込み中...');

  setSyncLabel('juku-sync','');

function showTutorLinks(){
  const sec=gs('tutor-links-section'); const list=gs('tutor-link-list'); list.innerHTML='';
  const base=location.origin+location.pathname;
  TUTORS.forEach(t=>{
    const url=`${base}?tutor=${t.id}`;

    item.innerHTML=`<span class="tl-name">${t.name}</span><span class="tl-url">${url}</span><button class="copy-btn" onclick="copyUrl('${url}',this)"><i class="ti ti-copy" style="font-size:12px"></i> コピー</button>`;

function copyUrl(url,btn){
  navigator.clipboard.writeText(url).then(()=>{
    btn.innerHTML='<i class="ti ti-check" style="font-size:12px"></i> コピー済み';
    setTimeout(()=>btn.innerHTML='<i class="ti ti-copy" style="font-size:12px"></i> コピー',2000);
    toast('リンクをコピーしました');
  });
}

function goRole(){ show('screen-juku',false); show('screen-tutor',false); gs('tutor-links-section').style.display='none'; show('screen-role') }

// ===== 塾側タブ =====
function jSwitch(tab){
  ['request','absence','schedule'].forEach(t=>{ gs('jtab-'+t).classList.toggle('active',t===tab); gs('jpane-'+t).classList.toggle('active',t===tab) });
  if(tab==='absence') loadAndRender(renderJAbs,'juku-sync');
  if(tab==='schedule') loadAndRender(renderJSch,'juku-sync');
}
function tSwitch(tab){
  ['requests','absence','schedule'].forEach(t=>{ gs('ttab-'+t).classList.toggle('active',t===tab); gs('tpane-'+t).classList.toggle('active',t===tab) });
  if(tab==='requests') loadAndRender(renderTReqs,'tutor-sync');
  if(tab==='schedule'){ const n=new Date(); if(cY3===undefined){cY3=n.getFullYear();cM3=n.getMonth()} loadAndRender(renderTSch,'tutor-sync'); }
}
async function loadAndRender(fn,syncId){ setSyncLabel(syncId,'更新中...'); await loadData(); setSyncLabel(syncId,''); fn() }

// ===== カレンダー1（塾側） =====
function cm(d){ cM+=d; if(cM>11){cM=0;cY++} if(cM<0){cM=11;cY--} renderCal() }
function renderCal(){
  gs('cal-lbl').textContent=`${cY}年${cM+1}月`;
  const g=gs('jcal'); g.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(d=>{ const e=document.createElement('div'); e.className='cal-dow'; e.textContent=d; g.appendChild(e) });
  const first=new Date(cY,cM,1).getDay();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-day empty'; g.appendChild(e) }
  const days=new Date(cY,cM+1,0).getDate();
  const tutor=gs('juku-tutor').value;
  for(let d=1;d<=days;d++){
    const k=dk(cY,cM,d);
    const e=document.createElement('div'); e.className='cal-day';
    e.textContent=d;
    if(k===jDate) e.classList.add('selected');
    if(tutor && requests[k]?.[tutor]){ const dot=document.createElement('div'); dot.className='cal-dot'; e.appendChild(dot) }
    e.onclick=()=>selJDate(k);
    g.appendChild(e);
  }
}

function selJDate(k){ jDate=k; jSel={}; renderCal(); renderJukuSlots() }

function renderJukuSlots(){
  const tutor=gs('juku-tutor').value;
  const wrap=gs('jslot-wrap');
  if(!jDate||!tutor){ wrap.style.display='none'; return }
  wrap.style.display='block';
  gs('jslot-title').textContent=`${fd(jDate)}　${tutor} 講師`;
  const c=gs('jslots'); c.innerHTML='';

  SLOTS.forEach(s=>{
    const entry=requests[jDate]?.[tutor]?.[s]||null;
    const status=entry?.status||null;
    const lockedLoc=entry?.location||null;

    const row=document.createElement('div');
    row.className='slot-row'+(status?' st-'+status:'');

    const timeEl=document.createElement('span');
    timeEl.className='slot-time'+(status==='rejected'?' disabled':'');
    timeEl.textContent=s;
    row.appendChild(timeEl);

    const locWrap=document.createElement('div'); locWrap.className='loc-btns';

    if(status){
      // 送信済み：勤務地を固定表示
      LOCS.forEach(loc=>{
        const b=document.createElement('button'); b.className='loc-btn locked'+(loc===lockedLoc?' sel':'');
        b.textContent=loc; b.disabled=true;
        locWrap.appendChild(b);
      });
      const badge=document.createElement('span');
      badge.className='slot-status '+(status==='pending'?'ss-pending':status==='accepted'?'ss-accepted':'ss-rejected');
      badge.textContent=status==='pending'?'依頼中':status==='accepted'?'✓ 承諾':'✕ 拒否';
      row.appendChild(locWrap); row.appendChild(badge);
      // 取り消しボタン
      const cancelBtn=document.createElement('button');
      cancelBtn.className='btn'; cancelBtn.style.cssText='padding:4px 10px;font-size:11px;margin-left:auto;color:#888;border-color:#ddd';
      cancelBtn.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i> 取消';
      cancelBtn.onclick=async()=>{
        if(!confirm(`${s}の依頼を取り消しますか？`)) return;
        await loadData();
        delete requests[jDate][tutor][s];
        if(Object.keys(requests[jDate][tutor]).length===0) delete requests[jDate][tutor];
        if(Object.keys(requests[jDate]||{}).length===0) delete requests[jDate];
        await saveRequests(); renderJukuSlots(); renderCal();
        toast('依頼を取り消しました');
      };
      row.appendChild(cancelBtn);
    } else {
      // 未送信：勤務地を選択
      LOCS.forEach(loc=>{
        const b=document.createElement('button'); b.className='loc-btn'+(jSel[s]===loc?' sel':'');
        b.textContent=loc;
        b.onclick=()=>{
          if(jSel[s]===loc){ delete jSel[s] } else { jSel[s]=loc }
          renderJukuSlots();
        };
        locWrap.appendChild(b);
      });
      row.appendChild(locWrap);
    }

    c.appendChild(row);
  });
}

async function sendRequest(){
  const tutor=gs('juku-tutor').value;
  const selected=Object.entries(jSel).filter(([,v])=>v);
  if(!tutor||!jDate||selected.length===0){ toast('講師・日付・時間帯と勤務地を選択してください'); return }
  await loadData();
  if(!requests[jDate]) requests[jDate]={};
  if(!requests[jDate][tutor]) requests[jDate][tutor]={};
  selected.forEach(([slot,loc])=>{ requests[jDate][tutor][slot]={status:'pending',location:loc} });
  await saveRequests();
  jSel={}; renderJukuSlots(); renderCal();
  toast(`${tutor}講師に依頼を送りました`);
}

// ===== カレンダー2（講師欠勤） =====
function cm2(d){ cM2+=d; if(cM2>11){cM2=0;cY2++} if(cM2<0){cM2=11;cY2--} renderCal2() }
function renderCal2(){
  gs('cal-lbl2').textContent=`${cY2}年${cM2+1}月`;
  const g=gs('tcal'); g.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(d=>{ const e=document.createElement('div'); e.className='cal-dow'; e.textContent=d; g.appendChild(e) });
  const first=new Date(cY2,cM2,1).getDay();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-day empty'; g.appendChild(e) }
  const days=new Date(cY2,cM2+1,0).getDate();
  for(let d=1;d<=days;d++){
    const k=dk(cY2,cM2,d);
    const e=document.createElement('div'); e.className='cal-day';
    e.textContent=d;
    if(k===tDate) e.classList.add('selected');
    if(absences[k]?.[currentTutor]){ const dot=document.createElement('div'); dot.className='cal-dot'; e.appendChild(dot) }
    e.onclick=()=>selTDate(k);
    g.appendChild(e);
  }
}

function selTDate(k){ tDate=k; tSel.clear(); renderCal2(); renderTAbsSlots() }

function renderTAbsSlots(){
  const wrap=gs('tslot-wrap');
  if(!tDate){ wrap.style.display='none'; return }
  wrap.style.display='block';
  gs('tslot-title').textContent=fd(tDate);
  const c=gs('tabs-slots'); c.innerHTML='';
  SLOTS.forEach(s=>{
    const status=absences[tDate]?.[currentTutor]?.[s]||null;
    const row=document.createElement('div'); row.className='abs-slot-row';
    const timeEl=document.createElement('span'); timeEl.className='abs-slot-time'; timeEl.textContent=s;
    row.appendChild(timeEl);
    if(status){
      const badge=document.createElement('span');
      badge.className='slot-status '+(status==='absence-pending'?'ss-ab-pending':'ss-ab-accepted');
      badge.textContent=status==='absence-pending'?'申請中':'承認済み';
      row.appendChild(badge);
      const cancelBtn=document.createElement('button');
      cancelBtn.className='btn'; cancelBtn.style.cssText='padding:4px 10px;font-size:11px;color:#888;border-color:#ddd';
      cancelBtn.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i> 取消';
      cancelBtn.onclick=async()=>{
        if(!confirm('欠勤申請を取り消しますか？')) return;
        await loadData();
        delete absences[tDate][currentTutor][s];
        if(Object.keys(absences[tDate][currentTutor]).length===0) delete absences[tDate][currentTutor];
        if(Object.keys(absences[tDate]||{}).length===0) delete absences[tDate];
        await saveAbsences(); renderTAbsSlots(); renderCal2();
        toast('欠勤申請を取り消しました');
      };
      row.appendChild(cancelBtn);
    } else {
      const chk=document.createElement('input'); chk.type='checkbox'; chk.className='abs-chk';
      chk.checked=tSel.has(s);
      chk.onchange=()=>{ tSel.has(s)?tSel.delete(s):tSel.add(s) };
      row.appendChild(chk);
    }
    c.appendChild(row);
  });
}

async function sendAbsence(){
  if(!tDate||tSel.size===0){ toast('日付と時間帯を選択してください'); return }
  await loadData();
  if(!absences[tDate]) absences[tDate]={};
  if(!absences[tDate][currentTutor]) absences[tDate][currentTutor]={};
  const absSlots = [...tSel];
  tSel.forEach(s=>{ absences[tDate][currentTutor][s]='absence-pending' });
  await saveAbsences();
  tSel.clear(); renderTAbsSlots(); renderCal2();
  toast('欠勤申請を送りました');
  // メール通知
  for(const s of absSlots){
    await sendShiftNotification('欠勤申請', currentTutor, tDate, s);
  }
}

// ===== 講師：依頼確認 =====
function renderTReqs(){
  const c=gs('treq-list'); c.innerHTML='';
  let any=false;
  Object.entries(requests).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,tutors])=>{
    const slots=tutors[currentTutor]; if(!slots) return;
    Object.entries(slots).forEach(([slot,entry])=>{
      const status=entry?.status||entry;
      const location=entry?.location||'';
      any=true;
      const item=document.createElement('div'); item.className='req-item';
      const lbl={pending:'未回答',accepted:'承諾済み',rejected:'拒否済み'}[status];
      const bc={pending:'pending',accepted:'accepted',rejected:'rejected'}[status];
      item.innerHTML=`<div class="ri-top">
        <span class="ri-label">${fd(date)}　${slot}</span>
        ${location?`<span class="ri-loc"><i class="ti ti-map-pin" style="font-size:11px"></i> ${location}</span>`:''}
        <span class="badge ${bc}">${lbl}</span>
      </div>`;
      const row=document.createElement('div'); row.className='btn-row';
      if(status==='pending'){
        const ba=document.createElement('button'); ba.className='btn success'; ba.innerHTML='<i class="ti ti-check"></i> 承諾';
        ba.onclick=async()=>{
          await loadData();
          requests[date][currentTutor][slot]={status:'accepted',location};
          await saveRequests(); renderTReqs(); toast('承諾しました');
        };
        const br=document.createElement('button'); br.className='btn danger'; br.innerHTML='<i class="ti ti-x"></i> 拒否';
        br.onclick=async()=>{
          await loadData();
          requests[date][currentTutor][slot]={status:'rejected',location};
          await saveRequests(); renderTReqs(); toast('拒否しました');
        };
        row.appendChild(ba); row.appendChild(br);
      }
      if(status==='accepted'){
        const br=document.createElement('button'); br.className='btn danger'; br.innerHTML='<i class="ti ti-refresh"></i> 拒否に変更';
        br.onclick=async()=>{
          if(!confirm('承諾を取り消して拒否に変更しますか？')) return;
          await loadData();
          requests[date][currentTutor][slot]={status:'rejected',location};
          await saveRequests(); renderTReqs(); renderTSch(); toast('拒否に変更しました');
          await sendShiftNotification('承諾→拒否に変更', currentTutor, date, slot, location);
        };
        row.appendChild(br);
      }
      if(status==='rejected'){
        const ba=document.createElement('button'); ba.className='btn success'; ba.innerHTML='<i class="ti ti-refresh"></i> 承諾に変更';
        ba.onclick=async()=>{
          if(!confirm('拒否を取り消して承諾に変更しますか？')) return;
          await loadData();
          requests[date][currentTutor][slot]={status:'accepted',location};
          await saveRequests(); renderTReqs(); renderTSch(); toast('承諾に変更しました');
        };
        row.appendChild(ba);
      }
      if(row.children.length) item.appendChild(row);
      c.appendChild(item);
    });
  });
  if(!any) c.innerHTML='<div class="empty">塾からの依頼はありません</div>';
}

// ===== 塾側：欠勤承認 =====
function renderJAbs(){
  const c=gs('jabs-list'); c.innerHTML='';
  let any=false;
  Object.entries(absences).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,tutors])=>{
    Object.entries(tutors).forEach(([tutor,slots])=>{
      Object.entries(slots).forEach(([slot,status])=>{
        any=true;
        const item=document.createElement('div'); item.className='req-item';
        const lbl=status==='absence-accepted'?'承認済み':'申請中';
        const bc=status==='absence-accepted'?'accepted':'ab-pending';
        item.innerHTML=`<div class="ri-top"><span class="ri-label">${tutor}　${fd(date)}　${slot}</span><span class="badge ${bc}">${lbl}</span></div>`;
        const row=document.createElement('div'); row.className='btn-row';
        if(status==='absence-pending'){
          const ba=document.createElement('button'); ba.className='btn success'; ba.innerHTML='<i class="ti ti-check"></i> 承認';
          ba.onclick=async()=>{
            await loadData();
            absences[date][tutor][slot]='absence-accepted';
            await saveAbsences(); renderJAbs(); toast(`${tutor}の欠勤を承認しました`);
          };
          row.appendChild(ba);
        }
        // 取り消しボタン（申請中・承認済みどちらも）
        const cancelBtn=document.createElement('button');
        cancelBtn.className='btn'; cancelBtn.style.cssText='padding:4px 10px;font-size:11px;color:#888;border-color:#ddd';
        cancelBtn.innerHTML='<i class="ti ti-trash" style="font-size:12px"></i> 取消';
        cancelBtn.onclick=async()=>{
          if(!confirm(`${tutor}の欠勤申請を取り消しますか？`)) return;
          await loadData();
          delete absences[date][tutor][slot];
          if(Object.keys(absences[date][tutor]).length===0) delete absences[date][tutor];
          if(Object.keys(absences[date]||{}).length===0) delete absences[date];
          await saveAbsences(); renderJAbs();
          toast('欠勤申請を取り消しました');
        };
        row.appendChild(cancelBtn);
        item.appendChild(row);
        c.appendChild(item);
      });
    });
  });
  if(!any) c.innerHTML='<div class="empty">欠勤申請はありません</div>';
}

// ===== 確定予定 =====
function renderJSch(){
  const c=gs('jsch-list');
  let items=[];
  Object.entries(requests).forEach(([date,tutors])=>{
    Object.entries(tutors).forEach(([tutor,slots])=>{
      Object.entries(slots).forEach(([slot,entry])=>{
        const status=entry?.status||entry;
        const location=entry?.location||'';
        if(status==='accepted') items.push({date,tutor,slot,location,type:'work'});
      });
    });
  });
  Object.entries(absences).forEach(([date,tutors])=>{
    Object.entries(tutors).forEach(([tutor,slots])=>{
      Object.entries(slots).forEach(([slot,status])=>{
        if(status==='absence-accepted') items.push({date,tutor,slot,location:'',type:'abs'});
      });
    });
  });
  items.sort((a,b)=>a.date.localeCompare(b.date)||a.slot.localeCompare(b.slot));
  if(!items.length){ c.innerHTML='<div class="empty">確定済みの予定はありません</div>'; return }
  c.innerHTML='<div class="sch-list">'+items.map(it=>`
    <div class="sch-item">
      <span class="sch-date">${fd(it.date)}</span>
      <span class="sch-name">${it.tutor}</span>
      <span class="sch-time">${it.slot}</span>
      ${it.location?`<span class="sch-loc">${it.location}</span>`:''}
      <span class="sch-badge ${it.type==='work'?'sb-work':'sb-abs'}">${it.type==='work'?'勤務':'欠勤'}</span>
    </div>`).join('')+'</div>';
}

let cY3, cM3;
function cm3(d){ cM3+=d; if(cM3>11){cM3=0;cY3++} if(cM3<0){cM3=11;cY3--} renderTSch() }

function renderTSch(){
  // 月が未初期化なら今月にセット
  if(cY3===undefined){ const n=new Date(); cY3=n.getFullYear(); cM3=n.getMonth() }
  gs('cal-lbl3').textContent=`${cY3}年${cM3+1}月`;

  // この月の確定データを収集
  const byDate={};
  Object.entries(requests).forEach(([date,tutors])=>{
    if(!date.startsWith(`${cY3}-${String(cM3+1).padStart(2,'0')}`)) return;
    const sl=tutors[currentTutor]; if(!sl) return;
    Object.entries(sl).forEach(([slot,entry])=>{
      const status=entry?.status||entry;
      const location=entry?.location||'';
      if(status==='accepted'){
        if(!byDate[date]) byDate[date]=[];
        byDate[date].push({slot,location,type:'work'});
      }
    });
  });
  Object.entries(absences).forEach(([date,tutors])=>{
    if(!date.startsWith(`${cY3}-${String(cM3+1).padStart(2,'0')}`)) return;
    const sl=tutors[currentTutor]; if(!sl) return;
    Object.entries(sl).forEach(([slot,status])=>{
      if(status==='absence-accepted'){
        if(!byDate[date]) byDate[date]=[];
        byDate[date].push({slot,location:'',type:'abs'});
      }
    });
  });

  const g=gs('tsch-cal'); g.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(d=>{
    const e=document.createElement('div'); e.className='sch-cal-dow'; e.textContent=d; g.appendChild(e);
  });

  const today=new Date(); today.setHours(0,0,0,0);
  const first=new Date(cY3,cM3,1).getDay();
  for(let i=0;i<first;i++){
    const e=document.createElement('div'); e.className='sch-cal-day empty'; g.appendChild(e);
  }
  const days=new Date(cY3,cM3+1,0).getDate();
  for(let d=1;d<=days;d++){
    const k=dk(cY3,cM3,d);
    const e=document.createElement('div'); e.className='sch-cal-day';
    const thisDay=new Date(cY3,cM3,d);
    if(thisDay.getTime()===today.getTime()) e.classList.add('today');

    const num=document.createElement('div'); num.className='scd-num'; num.textContent=d;
    e.appendChild(num);

    if(byDate[k]){
      byDate[k].sort((a,b)=>{
        const t=s=>{ const[h,m]=s.split('〜')[0].split(':'); return parseInt(h)*60+parseInt(m) };
        return t(a.slot)-t(b.slot);
      }).forEach(it=>{
        const tag=document.createElement('div');
        tag.className='sch-cal-entry '+(it.type==='work'?'sce-work':'sce-abs');
        const shortTime=it.slot.split('〜')[0];
        const locShort={'屋代':'屋','安茂里':'安','青木島':'青'}[it.location]||it.location;
        const locLabel=it.type==='work'?locShort:'欠';
        const locColorClass=it.location==='屋代'?'scl-yashiro':it.location==='青木島'?'scl-aoki':'scl-amori';
        const locClass=it.type==='work'?`scl ${locColorClass}`:'scl';
        tag.innerHTML=`<span class="sct">${shortTime}</span><span class="${locClass}">${locLabel}</span>`;
        e.appendChild(tag);
      });
    }
    g.appendChild(e);
  }
}
