<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講師名札メーカー｜明光義塾</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
    background: #f4f3ef;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 1.75rem;
    color: #333;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 span.accent {
    display: inline-block;
    width: 4px;
    height: 20px;
    background: #1D9E75;
    border-radius: 2px;
  }
  .container {
    max-width: 660px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    border: 0.5px solid #ddd;
  }
  .section-label {
    font-size: 12px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  input[type="text"] {
    width: 100%;
    max-width: 300px;
    padding: 10px 14px;
    font-size: 18px;
    font-family: inherit;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafaf9;
    color: #1a1a1a;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #1D9E75; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle-btn {
    padding: 7px 18px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: #fafaf9;
    color: #555;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn:hover { background: #f0f0ec; }
  .toggle-btn.active { background: #1D9E75; color: white; border-color: #1D9E75; }

  .color-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected { border-color: #1a1a1a; transform: scale(1.12); }

  /* Preview area */
  .preview-wrap {
    background: #e8e7e3;
    border-radius: 14px;
    padding: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 1.25rem;
    min-height: 220px;
    position: relative;
  }
  .preview-label {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.05em;
  }
  #preview {
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.3s;
  }

  /* Print button */
  .print-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #1D9E75;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .print-btn:hover { background: #178a64; }
  .print-btn svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .print-hint { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.6; }

  /* Multiple cards print */
  .multi-section { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .multi-section label { font-size: 13px; color: #666; }
  select.copies-sel {
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fafaf9;
    font-family: inherit;
    font-size: 13px;
    color: #333;
  }

  /* Print styles */
  @media print {
    body { background: white; padding: 0; }
    .container, .card, .preview-wrap, h1 { display: none !important; }
    #print-area { display: block !important; }
  }
  #print-area { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1><span class="accent"></span>講師名札メーカー</h1>

  <div class="card">
    <p class="section-label">向き</p>
    <div class="btn-group">
      <button class="toggle-btn active" data-dir="landscape" onclick="setDir(this)">横向き（91×55mm）</button>
      <button class="toggle-btn" data-dir="portrait" onclick="setDir(this)">縦向き（55×91mm）</button>
    </div>
  </div>

  <div class="card">
    <p class="section-label">名前（下の名前のみ）</p>
    <input type="text" id="nameInput" value="ゆら" maxlength="8" oninput="render()" placeholder="例: このん" />
  </div>

  <div class="card">
    <p class="section-label">フォント</p>
    <div class="btn-group">
      <button class="toggle-btn active" data-font="gothic" onclick="setFont(this)">ゴシック体</button>
      <button class="toggle-btn" data-font="mincho" onclick="setFont(this)">明朝体</button>
      <button class="toggle-btn" data-font="round" onclick="setFont(this)">丸ゴシック</button>
    </div>
  </div>

  <div class="card">
    <p class="section-label">カラーテーマ</p>
    <div class="color-row">
      <div class="swatch selected" style="background:#1D9E75" onclick="setColor(this,'#1D9E75','#E1F5EE')" title="グリーン"></div>
      <div class="swatch" style="background:#185FA5" onclick="setColor(this,'#185FA5','#E6F1FB')" title="ブルー"></div>
      <div class="swatch" style="background:#7F77DD" onclick="setColor(this,'#7F77DD','#EEEDFE')" title="パープル"></div>
      <div class="swatch" style="background:#D4537E" onclick="setColor(this,'#D4537E','#FBEAF0')" title="ピンク"></div>
      <div class="swatch" style="background:#D85A30" onclick="setColor(this,'#D85A30','#FAECE7')" title="コーラル"></div>
      <div class="swatch" style="background:#BA7517" onclick="setColor(this,'#BA7517','#FAEEDA')" title="アンバー"></div>
      <div class="swatch" style="background:#2C2C2A" onclick="setColor(this,'#2C2C2A','#F1EFE8')" title="チャコール"></div>
      <div class="swatch" style="background:#C49A00;border:1px solid #bbb" onclick="setColor(this,'#C49A00','#FFFBE6')" title="イエロー"></div>
    </div>
  </div>

  <div class="preview-wrap">
    <span class="preview-label">プレビュー（実寸比）</span>
    <div id="preview"></div>
  </div>

  <div class="card">
    <p class="section-label">印刷</p>
    <button class="print-btn" onclick="doPrint()">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      印刷 / PDF保存
    </button>
    <div class="multi-section">
      <label>1ページに印刷する枚数：</label>
      <select class="copies-sel" id="copies">
        <option value="1">1枚</option>
        <option value="2">2枚</option>
        <option value="4">4枚</option>
        <option value="8">8枚</option>
      </select>
    </div>
    <p class="print-hint">
      ※ ブラウザの印刷ダイアログで「用紙サイズ: A4」「余白: なし」「背景のグラフィック: ON」に設定してください。<br>
      PDF保存する場合は「送信先: PDFに保存」を選択してください。
    </p>
  </div>
</div>

<!-- hidden print area -->
<div id="print-area"></div>

<script>
  let dir = 'landscape';
  let accentColor = '#1D9E75';
  let bgLight = '#E1F5EE';
  let fontStack = '"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif';

  const PX = 3.5; // px per mm for preview

  function setDir(btn) {
    document.querySelectorAll('[data-dir]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dir = btn.dataset.dir;
    render();
  }
  function setFont(btn) {
    document.querySelectorAll('[data-font]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.font;
    if(f === 'gothic') fontStack = '"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif';
    else if(f === 'mincho') fontStack = '"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif';
    else fontStack = '"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Meiryo",sans-serif';
    render();
  }
  function setColor(el, acc, bg) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    accentColor = acc;
    bgLight = bg;
    render();
  }

  function buildCardHTML(wMM, hMM, nameFontMM, labelFontMM, schoolFontMM, isLandscape, name, unit) {
    // unit: 'mm' for print, 'px' for preview
    const u = unit;
    const w = wMM, h = hMM;
    const headerH = Math.round(h * 0.22);
    const nameFs = nameFontMM;
    const labelFs = labelFontMM;
    const schoolFs = schoolFontMM;

    if(isLandscape) {
      return `<div style="width:${w}${u};height:${h}${u};display:flex;flex-direction:column;font-family:${fontStack};overflow:hidden;background:#fff;">
        <div style="background:${accentColor};padding:${Math.round(h*0.07)}${u} ${Math.round(w*0.045)}${u};display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
          <span style="color:white;font-size:${schoolFs}${u};font-weight:600;letter-spacing:0.05em;">明光義塾</span>
          <span style="color:rgba(255,255,255,0.85);font-size:${Math.round(schoolFs*0.7)}${u};letter-spacing:0.12em;">MEIKO GIJUKU</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:${Math.round(h*0.05)}${u} ${Math.round(w*0.05)}${u};gap:${Math.round(h*0.04)}${u};">
          <span style="font-size:${labelFs}${u};color:${accentColor};font-weight:600;letter-spacing:0.3em;border-bottom:${unit==='mm'?'0.5mm':'1px'} solid ${accentColor};padding-bottom:${Math.round(h*0.025)}${u};width:100%;text-align:center;">講　師</span>
          <span style="font-size:${nameFs}${u};color:#1a1a1a;font-weight:700;letter-spacing:0.04em;line-height:1;">${name}</span>
        </div>
      </div>`;
    } else {
      return `<div style="width:${w}${u};height:${h}${u};display:flex;flex-direction:column;font-family:${fontStack};overflow:hidden;background:#fff;">
        <div style="background:${accentColor};padding:${Math.round(w*0.07)}${u};text-align:center;flex-shrink:0;">
          <div style="color:white;font-size:${schoolFs}${u};font-weight:600;letter-spacing:0.05em;">明光義塾</div>
          <div style="color:rgba(255,255,255,0.85);font-size:${Math.round(schoolFs*0.7)}${u};letter-spacing:0.12em;">MEIKO GIJUKU</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:${Math.round(w*0.07)}${u};gap:${Math.round(w*0.05)}${u};">
          <span style="font-size:${labelFs}${u};color:${accentColor};font-weight:600;letter-spacing:0.3em;border-bottom:${unit==='mm'?'0.5mm':'1px'} solid ${accentColor};padding-bottom:${Math.round(w*0.025)}${u};width:100%;text-align:center;">講　師</span>
          <span style="font-size:${nameFs}${u};color:#1a1a1a;font-weight:700;letter-spacing:0.04em;line-height:1.1;text-align:center;">${name}</span>
        </div>
      </div>`;
    }
  }

  function render() {
    const name = document.getElementById('nameInput').value || 'ゆら';
    const isL = dir === 'landscape';
    const wMM = isL ? 91 : 55;
    const hMM = isL ? 55 : 91;
    const wPX = Math.round(wMM * PX);
    const hPX = Math.round(hMM * PX);

    const nameFs = isL ? Math.round(hPX * 0.38) : Math.round(wPX * 0.38);
    const labelFs = isL ? Math.round(hPX * 0.12) : Math.round(wPX * 0.12);
    const schoolFs = isL ? Math.round(hPX * 0.10) : Math.round(wPX * 0.10);

    const html = buildCardHTML(wPX, hPX, nameFs, labelFs, schoolFs, isL, name, 'px');
    document.getElementById('preview').innerHTML = html;
    document.getElementById('preview').style.width = wPX + 'px';
    document.getElementById('preview').style.height = hPX + 'px';
  }

  function doPrint() {
    const name = document.getElementById('nameInput').value || 'ゆら';
    const copies = parseInt(document.getElementById('copies').value);
    const isL = dir === 'landscape';
    const wMM = isL ? 91 : 55;
    const hMM = isL ? 55 : 91;

    const nameFs = isL ? Math.round(hMM * 0.38) : Math.round(wMM * 0.38);
    const labelFs = isL ? Math.round(hMM * 0.12) : Math.round(wMM * 0.12);
    const schoolFs = isL ? Math.round(hMM * 0.10) : Math.round(wMM * 0.10);

    const oneCard = buildCardHTML(wMM, hMM, nameFs, labelFs, schoolFs, isL, name, 'mm');

    // Tile cards in a flex grid
    let cards = '';
    for(let i = 0; i < copies; i++) {
      cards += `<div style="margin:3mm;">${oneCard}</div>`;
    }

    const pw = window.open('', '_blank');
    pw.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>名札 ${name}</title>
<style>
  @page { size: A4 portrait; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: white; }
  .grid { display: flex; flex-wrap: wrap; justify-content: flex-start; }
  @media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style></head><body>
<div class="grid">${cards}</div>
<script>window.onload = () => { setTimeout(() => window.print(), 300); };<\/script>
</body></html>`);
    pw.document.close();
  }

  render();
</script>
</body>
</html>
