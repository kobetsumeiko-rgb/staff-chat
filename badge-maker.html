<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講師名札メーカー｜明光義塾</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif;
    background: #f4f3ef; color: #1a1a1a;
    min-height: 100vh; padding: 2rem 1rem 4rem;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 {
    font-size: 20px; font-weight: 500; margin-bottom: 1.75rem;
    color: #333; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 8px;
  }
  h1 span.accent {
    display: inline-block; width: 4px; height: 20px;
    background: #1D9E75; border-radius: 2px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 1.25rem 1.5rem;
    margin-bottom: 1.1rem; border: 0.5px solid #ddd;
  }
  .section-label {
    font-size: 11px; font-weight: 600; color: #999;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;
  }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle-btn {
    padding: 7px 16px; border-radius: 20px;
    border: 1px solid #ddd; background: #fafaf9; color: #555;
    font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .toggle-btn:hover { background: #f0f0ec; }
  .toggle-btn.active { background: #1D9E75; color: white; border-color: #1D9E75; }

  .color-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected { border-color: #1a1a1a; transform: scale(1.12); }

  /* 名前入力テーブル */
  .names-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .names-table th {
    font-size: 11px; color: #aaa; font-weight: 500;
    text-align: left; padding: 0 4px 6px; border-bottom: 1px solid #eee;
  }
  .names-table td { padding: 5px 4px; vertical-align: middle; }
  .names-table td:first-child { width: 32px; text-align: center; }
  .num-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: #eee; color: #999; font-size: 10px; font-weight: 600;
  }
  .num-badge.filled { background: #1D9E75; color: white; }
  .name-input {
    width: 100%; padding: 7px 10px; font-size: 15px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 7px;
    background: #fafaf9; color: #1a1a1a; outline: none;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: #1D9E75; }
  .name-input.filled { border-color: #1D9E75; background: #fff; }

  /* プレビュー */
  .preview-head {
    font-size: 11px; font-weight: 600; color: #999;
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;
  }
  .preview-grid {
    display: flex; flex-wrap: wrap; gap: 12px;
    background: #e8e7e3; border-radius: 14px; padding: 1.25rem;
    min-height: 100px; margin-bottom: 1.1rem;
  }
  .preview-item { position: relative; }
  .preview-num {
    position: absolute; top: -8px; left: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #1D9E75; color: white;
    font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .preview-empty { color: #bbb; font-size: 13px; align-self: center; padding: 0.5rem; }

  /* 印刷 */
  .print-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; background: #1D9E75; color: white;
    border: none; border-radius: 8px; font-size: 15px;
    font-family: inherit; font-weight: 500; cursor: pointer; transition: background 0.2s;
  }
  .print-btn:hover { background: #178a64; }
  .print-btn:disabled { background: #bbb; cursor: not-allowed; }
  .print-btn svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .print-hint { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.7; }
  .badge-count { font-size: 13px; color: #666; margin-bottom: 12px; }
  .badge-count strong { color: #1D9E75; }

  @media print {
    body, .container { display: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <h1><span class="accent"></span>講師名札メーカー</h1>

  <div class="card">
    <p class="section-label">向き</p>
    <div class="btn-group">
      <button class="toggle-btn active" data-dir="landscape" onclick="setDir(this)">横向き（91×55mm）</button>
      <button class="toggle-btn" data-dir="portrait" onclick="setDir(this)">縦向き（55×91mm）</button>
    </div>
  </div>

  <div class="card">
    <p class="section-label">フォント</p>
    <div class="btn-group">
      <button class="toggle-btn active" data-font="gothic" onclick="setFont(this)">ゴシック体</button>
      <button class="toggle-btn" data-font="mincho" onclick="setFont(this)">明朝体</button>
      <button class="toggle-btn" data-font="round" onclick="setFont(this)">丸ゴシック</button>
    </div>
  </div>

  <div class="card">
    <p class="section-label">カラーテーマ</p>
    <div class="color-row">
      <div class="swatch selected" style="background:#1D9E75" onclick="setColor(this,'#1D9E75')" title="グリーン"></div>
      <div class="swatch" style="background:#185FA5" onclick="setColor(this,'#185FA5')" title="ブルー"></div>
      <div class="swatch" style="background:#7F77DD" onclick="setColor(this,'#7F77DD')" title="パープル"></div>
      <div class="swatch" style="background:#D4537E" onclick="setColor(this,'#D4537E')" title="ピンク"></div>
      <div class="swatch" style="background:#D85A30" onclick="setColor(this,'#D85A30')" title="コーラル"></div>
      <div class="swatch" style="background:#BA7517" onclick="setColor(this,'#BA7517')" title="アンバー"></div>
      <div class="swatch" style="background:#2C2C2A" onclick="setColor(this,'#2C2C2A')" title="チャコール"></div>
      <div class="swatch" style="background:#C49A00;border:1px solid #bbb" onclick="setColor(this,'#C49A00')" title="イエロー"></div>
    </div>
  </div>

  <div class="card">
    <p class="section-label">講師名（最大8人）</p>
    <table class="names-table">
      <thead>
        <tr>
          <th></th>
          <th>苗字（漢字）</th>
          <th>下の名前（ひらがな）</th>
        </tr>
      </thead>
      <tbody id="namesBody"></tbody>
    </table>
  </div>

  <p class="preview-head">プレビュー</p>
  <div class="preview-grid" id="previewGrid">
    <span class="preview-empty">名前を入力するとプレビューが表示されます</span>
  </div>

  <div class="card">
    <p class="section-label">印刷</p>
    <p class="badge-count" id="badgeCount">入力済み：<strong>0</strong> 人分</p>
    <button class="print-btn" id="printBtn" onclick="doPrint()" disabled>
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      A4印刷 / PDF保存
    </button>
    <p class="print-hint">
      ※ 印刷ダイアログで「用紙サイズ: A4」「余白: なし」「背景のグラフィック: ON」に設定してください。<br>
      ※ 入力した人数分だけ名札が並んで印刷されます（A4に最大8枚）。
    </p>
  </div>
</div>

<script>
  let dir = 'landscape';
  let accentColor = '#1D9E75';
  let fontStack = '"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif';
  const MAX = 8;
  const PX = 2.8;

  // 入力行を生成
  const tbody = document.getElementById('namesBody');
  for(let i = 0; i < MAX; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="num-badge" id="badge${i}">${i+1}</span></td>
      <td><input class="name-input" id="sei${i}" type="text" maxlength="6" placeholder="例: 田中" oninput="onInput()"></td>
      <td><input class="name-input" id="mei${i}" type="text" maxlength="8" placeholder="例: ゆら" oninput="onInput()"></td>`;
    tbody.appendChild(tr);
  }

  function onInput() {
    for(let i = 0; i < MAX; i++) {
      const s = document.getElementById('sei'+i).value.trim();
      const m = document.getElementById('mei'+i).value.trim();
      const filled = s || m;
      document.getElementById('sei'+i).classList.toggle('filled', !!s);
      document.getElementById('mei'+i).classList.toggle('filled', !!m);
      document.getElementById('badge'+i).classList.toggle('filled', !!filled);
    }
    renderAll();
  }

  function getPeople() {
    const list = [];
    for(let i = 0; i < MAX; i++) {
      const sei = document.getElementById('sei'+i).value.trim();
      const mei = document.getElementById('mei'+i).value.trim();
      if(sei || mei) list.push({ sei, mei });
    }
    return list;
  }

  function setDir(btn) {
    document.querySelectorAll('[data-dir]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dir = btn.dataset.dir;
    renderAll();
  }
  function setFont(btn) {
    document.querySelectorAll('[data-font]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.font;
    if(f === 'gothic') fontStack = '"Hiragino Kaku Gothic ProN","Meiryo","Yu Gothic",sans-serif';
    else if(f === 'mincho') fontStack = '"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif';
    else fontStack = '"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Meiryo",sans-serif';
    renderAll();
  }
  function setColor(el, acc) {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    accentColor = acc;
    renderAll();
  }

  // カードHTML生成
  // レイアウト:
  //   上帯: 明光義塾ロゴ
  //   中段: 苗字（小さめ）
  //   下段: ひらがな名前（大きめ）＋右下に「先生」
  function buildCard(w, h, isL, sei, mei, unit) {
    const u = unit;
    const tc = '#FFE650'; // ロゴ文字は常に黄色

    // フォントサイズ
    const base = isL ? h : w;
    const schoolFs  = Math.round(base * 0.11);  // ロゴ帯：明光義塾
    const seiFs     = Math.round(base * 0.16);  // 苗字
    const meiFs     = Math.round(base * 0.30);  // 下の名前（大きめ）
    const senseiFs  = Math.round(base * 0.11);  // 「先生」

    // ヘッダー帯の高さ
    const headerPad = Math.round(base * 0.065);

    return `<div style="width:${w}${u};height:${h}${u};display:flex;flex-direction:column;font-family:${fontStack};overflow:hidden;background:#fff;position:relative;">
      <!-- ヘッダー帯 -->
      <div style="background:${accentColor};padding:${headerPad}${u} ${Math.round(w*0.045)}${u};display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
        <span style="color:${tc};font-size:${schoolFs}${u};font-weight:700;letter-spacing:0.06em;">明光義塾</span>
        <span style="color:${tc};opacity:0.8;font-size:${Math.round(schoolFs*0.68)}${u};letter-spacing:0.12em;">MEIKO GIJUKU</span>
      </div>
      <!-- 名前エリア -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:${Math.round(base*0.04)}${u} ${Math.round(w*0.05)}${u} ${Math.round(base*0.05)}${u};gap:${Math.round(base*0.01)}${u};">
        <!-- 苗字 -->
        <div style="font-size:${seiFs}${u};color:#555;font-weight:500;letter-spacing:0.18em;text-align:center;line-height:1;">${sei || '　'}</div>
        <!-- 下の名前 ＋ 先生（右下添え） -->
        <div style="display:flex;align-items:flex-end;gap:${Math.round(base*0.015)}${u};line-height:1;">
          <span style="font-size:${meiFs}${u};color:#1a1a1a;font-weight:700;letter-spacing:0.04em;line-height:1;">${mei || '　'}</span>
          <span style="font-size:${senseiFs}${u};color:${accentColor};font-weight:600;letter-spacing:0.05em;padding-bottom:${Math.round(base*0.008)}${u};">先生</span>
        </div>
      </div>
    </div>`;
  }

  function getDims(isL, unit) {
    if(unit === 'px') {
      return { w: Math.round((isL?91:55)*PX), h: Math.round((isL?55:91)*PX) };
    }
    return { w: isL?91:55, h: isL?55:91 };
  }

  function renderAll() {
    const people = getPeople();
    const isL = dir === 'landscape';
    const { w, h } = getDims(isL, 'px');
    const pg = document.getElementById('previewGrid');
    const countEl = document.getElementById('badgeCount');
    const printBtn = document.getElementById('printBtn');

    if(people.length === 0) {
      pg.innerHTML = '<span class="preview-empty">名前を入力するとプレビューが表示されます</span>';
      countEl.innerHTML = '入力済み：<strong>0</strong> 人分';
      printBtn.disabled = true;
      return;
    }

    pg.innerHTML = '';
    people.forEach(({ sei, mei }, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-item';
      wrap.innerHTML =
        `<div class="preview-num">${i+1}</div>` +
        `<div style="box-shadow:0 3px 14px rgba(0,0,0,0.13);border-radius:6px;overflow:hidden;">` +
        buildCard(w, h, isL, sei, mei, 'px') +
        `</div>`;
      pg.appendChild(wrap);
    });

    countEl.innerHTML = `入力済み：<strong>${people.length}</strong> 人分`;
    printBtn.disabled = false;
  }

  function doPrint() {
    const people = getPeople();
    if(people.length === 0) return;
    const isL = dir === 'landscape';
    const { w, h } = getDims(isL, 'mm');

    const cards = people.map(({ sei, mei }) =>
      `<div style="margin:3mm;display:inline-block;">${buildCard(w, h, isL, sei, mei, 'mm')}</div>`
    ).join('');

    const pw = window.open('', '_blank');
    pw.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<title>名札印刷</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: white; }
  .grid { display: flex; flex-wrap: wrap; align-items: flex-start; }
  @media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style></head><body>
<div class="grid">${cards}</div>
<script>window.onload = () => { setTimeout(() => window.print(), 400); };<\/script>
</body></html>`);
    pw.document.close();
  }

  renderAll();
</script>
</body>
</html>
