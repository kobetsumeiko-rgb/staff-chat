<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面談予約 管理｜明光義塾 安茂里駅前</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --orange: #E8600A;
    --orange-light: #FFF0E6;
    --dark: #1A1A1A;
    --gray: #6B7280;
    --line: #E5E7EB;
    --bg: #F8F7F4;
    --green: #10B981;
    --red: #EF4444;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

  /* PIN認証 */
  #pinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .pin-card {
    background: white;
    border-radius: 16px;
    padding: 36px 28px;
    width: 320px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .pin-card h2 { font-size: 1.1rem; margin-bottom: 6px; }
  .pin-card p { font-size: 0.8rem; color: var(--gray); margin-bottom: 24px; }
  .pin-input {
    width: 100%; padding: 12px; text-align: center;
    font-size: 1.3rem; letter-spacing: 0.3em;
    border: 2px solid var(--line); border-radius: 8px;
    font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .pin-input:focus { border-color: var(--orange); }
  .pin-btn {
    width: 100%; margin-top: 14px;
    background: var(--orange); color: white;
    border: none; border-radius: 8px;
    padding: 13px; font-family: inherit;
    font-size: 0.95rem; font-weight: 700;
    cursor: pointer;
  }
  .pin-error { color: var(--red); font-size: 0.8rem; margin-top: 8px; }

  /* メイン */
  #mainApp { display: none; }

  header {
    background: var(--dark);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 0.95rem; font-weight: 700; }
  header .badge { font-size: 0.72rem; background: var(--orange); padding: 3px 10px; border-radius: 20px; }

  .main-container { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: white;
    border-radius: var(--radius);
    padding: 5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--gray);
    transition: all 0.2s;
  }
  .tab-btn.active { background: var(--orange); color: white; }

  .card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 0.8rem; font-weight: 700;
    color: var(--gray); letter-spacing: 0.06em;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before {
    content: ''; width: 3px; height: 14px;
    background: var(--orange); border-radius: 2px; display: block;
  }

  /* タブパネル */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 空き枠設定 */
  .date-input-row {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .date-input-row .fg { flex: 1; min-width: 140px; }
  label.small { font-size: 0.8rem; font-weight: 700; display: block; margin-bottom: 6px; }
  input[type="date"], input[type="time"], input[type="text"] {
    width: 100%; padding: 9px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; outline: none;
  }
  input:focus { border-color: var(--orange); }

  .time-tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .time-tag {
    display: flex; align-items: center; gap: 6px;
    background: var(--orange-light); border: 1px solid var(--orange);
    border-radius: 20px; padding: 4px 12px;
    font-size: 0.82rem; font-weight: 700; color: var(--orange);
  }
  .time-tag button {
    background: none; border: none; cursor: pointer;
    color: var(--orange); font-size: 1rem; padding: 0; line-height: 1;
  }

  .quick-add { margin-bottom: 16px; }
  .quick-add p { font-size: 0.78rem; color: var(--gray); margin-bottom: 8px; }
  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn {
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: white;
    font-size: 0.78rem; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .quick-btn:hover { border-color: var(--orange); color: var(--orange); }

  .available-dates-list { display: flex; flex-direction: column; gap: 10px; }
  .date-row {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-row .date-label { font-weight: 700; font-size: 0.9rem; min-width: 160px; }
  .date-row .slots-tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
  .slot-chip {
    background: #F0FDF4; border: 1px solid #6EE7B7;
    border-radius: 4px; padding: 2px 8px;
    font-size: 0.75rem; color: #065F46;
  }
  .slot-chip.booked {
    background: #FEF2F2; border-color: #FCA5A5;
    color: #991B1B;
  }
  .del-btn {
    background: none; border: none;
    color: var(--red); cursor: pointer;
    font-size: 0.78rem; padding: 4px 8px;
    border: 1px solid var(--red); border-radius: 6px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .del-btn:hover { background: #FEF2F2; }

  .btn-primary {
    background: var(--orange); color: white;
    border: none; border-radius: 8px;
    padding: 11px 20px; font-family: inherit;
    font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary:hover { background: #C7520A; }
  .btn-primary:disabled { background: #D1D5DB; cursor: not-allowed; }

  /* 予約一覧 */
  .booking-filters {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--line); background: white;
    font-family: inherit; font-size: 0.8rem;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }

  .booking-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: box-shadow 0.2s;
  }
  .booking-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .booking-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 8px;
  }
  .booking-name { font-weight: 700; font-size: 1rem; }
  .booking-id-small { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }
  .booking-datetime {
    font-size: 0.85rem; color: var(--gray);
    margin-bottom: 6px;
  }
  .booking-memo { font-size: 0.8rem; color: var(--gray); background: var(--bg); padding: 6px 10px; border-radius: 6px; }
  .status-badge {
    font-size: 0.72rem; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .status-badge.confirmed { background: #D1FAE5; color: #065F46; }
  .status-badge.cancelled { background: #FEF2F2; color: #991B1B; }
  .booking-actions { display: flex; gap: 6px; margin-top: 10px; }
  .cancel-btn {
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--red); color: var(--red);
    background: white; font-family: inherit;
    font-size: 0.78rem; cursor: pointer;
  }
  .cancel-btn:hover { background: #FEF2F2; }

  .empty-state { text-align: center; padding: 40px; color: var(--gray); font-size: 0.85rem; }

  /* 通知 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--dark); color: white;
    padding: 12px 24px; border-radius: 30px;
    font-size: 0.88rem; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 9999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .loading-spinner { text-align: center; padding: 30px; color: var(--gray); }
</style>
</head>
<body>

<!-- PIN認証 -->
<div id="pinScreen">
  <div class="pin-card">
    <h2>管理者ログイン</h2>
    <p>面談予約 管理パネル<br>安茂里駅前教室</p>
    <input type="password" class="pin-input" id="pinInput" placeholder="PIN" maxlength="6"
      onkeydown="if(event.key==='Enter')checkPin()">
    <button class="pin-btn" onclick="checkPin()">ログイン</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- メインアプリ -->
<div id="mainApp">
  <header>
    <h1>面談予約 管理パネル｜安茂里駅前</h1>
    <span class="badge">管理者</span>
  </header>

  <div class="main-container">

    <!-- 受付状態カード -->
    <div class="card" id="statusCard" style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
      <div>
        <div style="font-weight:700;font-size:0.95rem;">予約受付</div>
        <div style="font-size:0.78rem;color:var(--gray);margin-top:3px;" id="statusDesc">読み込み中…</div>
      </div>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;">
        <span id="statusLabel" style="font-size:0.85rem;font-weight:700;color:var(--gray);">OFF</span>
        <div style="position:relative;width:50px;height:28px;" onclick="toggleStatus()">
          <div id="switchTrack" style="width:50px;height:28px;border-radius:14px;background:#D1D5DB;transition:background 0.2s;"></div>
          <div id="switchThumb" style="position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,0.2);transition:left 0.2s;"></div>
        </div>
      </label>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('slots')">📅 空き枠設定</button>
      <button class="tab-btn" onclick="switchTab('bookings')">📋 予約一覧</button>
    </div>

    <!-- タブ1: 空き枠設定 -->
    <div class="tab-panel active" id="tab-slots">
      <div class="card">
        <div class="card-title">面談可能な日時を追加</div>

        <div class="date-input-row">
          <div class="fg">
            <label class="small">日付</label>
            <input type="date" id="newDate">
          </div>
        </div>

        <div class="quick-add">
          <p>開始時刻を選んで追加（クリックで選択）</p>
          <div class="quick-btns" id="quickBtns"></div>
        </div>

        <div class="time-tag-list" id="timeTagList"></div>

        <button class="btn-primary" onclick="saveSlots()" id="saveBtn">この日の空き枠を保存</button>
      </div>

      <div class="card">
        <div class="card-title">設定済みの空き枠</div>
        <div class="available-dates-list" id="availableDatesList">
          <div class="loading-spinner">読み込み中…</div>
        </div>
      </div>
    </div>

    <!-- タブ2: 予約一覧 -->
    <div class="tab-panel" id="tab-bookings">
      <div class="card">
        <div class="card-title">予約一覧</div>
        <div class="booking-filters">
          <button class="filter-btn active" onclick="filterBookings('all', this)">すべて</button>
          <button class="filter-btn" onclick="filterBookings('upcoming', this)">今後の予約</button>
          <button class="filter-btn" onclick="filterBookings('past', this)">過去</button>
          <button class="filter-btn" onclick="filterBookings('cancelled', this)">キャンセル済</button>
        </div>
        <div id="bookingsList">
          <div class="loading-spinner">読み込み中…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER_URL = 'https://notion-proxy.kobetsu-meiko.workers.dev';
const CLASSROOM = 'amorisan';
const ADMIN_PIN = '1234'; // ← ここを変更してください

let allSlots = {};
let allBookings = [];
let selectedTimes = [];
let currentFilter = 'all';

// ===== PIN認証 =====
function checkPin() {
  const pin = document.getElementById('pinInput').value;
  if (pin === ADMIN_PIN) {
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    initAdmin();
  } else {
    document.getElementById('pinError').textContent = 'PINが正しくありません';
    document.getElementById('pinInput').value = '';
  }
}

async function initAdmin() {
  setupTimeButtons();
  setTodayAsDefault();
  await Promise.all([loadSlots(), loadBookings(), loadStatus()]);
}

function setTodayAsDefault() {
  const today = new Date();
  document.getElementById('newDate').value = formatDate(today);
}

// ===== 時間ボタン生成（8:00〜20:30を30分刻み） =====
function setupTimeButtons() {
  const container = document.getElementById('quickBtns');
  container.innerHTML = '';
  for (let h = 8; h <= 20; h++) {
    ['00','30'].forEach(m => {
      if (h === 20 && m === '30') return;
      const time = `${String(h).padStart(2,'0')}:${m}`;
      const btn = document.createElement('button');
      btn.className = 'quick-btn';
      btn.textContent = time;
      btn.dataset.time = time;
      btn.onclick = () => toggleTime(time, btn);
      container.appendChild(btn);
    });
  }
}

function toggleTime(time, btn) {
  const idx = selectedTimes.indexOf(time);
  if (idx >= 0) {
    selectedTimes.splice(idx, 1);
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  } else {
    selectedTimes.push(time);
    btn.style.background = '#E8600A';
    btn.style.borderColor = '#E8600A';
    btn.style.color = 'white';
  }
  renderTimeTags();
}

function renderTimeTags() {
  const list = document.getElementById('timeTagList');
  list.innerHTML = '';
  selectedTimes.sort().forEach(time => {
    const tag = document.createElement('div');
    tag.className = 'time-tag';
    tag.innerHTML = `${time} <button onclick="removeTime('${time}')">✕</button>`;
    list.appendChild(tag);
  });
}

function removeTime(time) {
  selectedTimes = selectedTimes.filter(t => t !== time);
  // ボタンの色も戻す
  document.querySelectorAll('.quick-btn').forEach(btn => {
    if (btn.dataset.time === time) {
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }
  });
  renderTimeTags();
}

// ===== スロット保存 =====
async function saveSlots() {
  const date = document.getElementById('newDate').value;
  if (!date) { showToast('日付を選択してください'); return; }
  if (selectedTimes.length === 0) { showToast('時間を1つ以上選択してください'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/slots`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Pin': ADMIN_PIN,
      },
      body: JSON.stringify({ classroom: CLASSROOM, date, times: selectedTimes }),
    });
    const data = await res.json();
    if (data.success) {
      showToast(`✅ ${date} の空き枠を保存しました`);
      selectedTimes = [];
      renderTimeTags();
      // ボタンリセット
      document.querySelectorAll('.quick-btn').forEach(b => {
        b.style.background = b.style.borderColor = b.style.color = '';
      });
      await loadSlots();
    } else {
      throw new Error(data.error || '保存失敗');
    }
  } catch(e) {
    showToast('エラー: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'この日の空き枠を保存';
  }
}

// ===== スロット読み込み =====
async function loadSlots() {
  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/slots?classroom=${CLASSROOM}`, {
      headers: { 'X-Admin-Pin': ADMIN_PIN }
    });
    const data = await res.json();
    allSlots = data.slots || {};
    renderSlotsList();
  } catch(e) {
    document.getElementById('availableDatesList').innerHTML =
      '<div style="color:#EF4444;text-align:center;padding:20px">読み込みに失敗しました</div>';
  }
}

function renderSlotsList() {
  const container = document.getElementById('availableDatesList');
  const sortedDates = Object.keys(allSlots).sort();
  if (sortedDates.length === 0) {
    container.innerHTML = '<div class="empty-state">設定済みの空き枠はありません</div>';
    return;
  }
  container.innerHTML = '';
  sortedDates.forEach(dateStr => {
    const slots = allSlots[dateStr];
    const row = document.createElement('div');
    row.className = 'date-row';
    const d = new Date(dateStr);
    const jaDow = ['日','月','火','水','木','金','土'];
    const dateLabel = `${d.getMonth()+1}月${d.getDate()}日（${jaDow[d.getDay()]}）`;
    const chips = slots.map(s =>
      `<span class="slot-chip${s.available ? '' : ' booked'}">${s.time}${s.available ? '' : '✓'}</span>`
    ).join('');
    row.innerHTML = `
      <div>
        <div class="date-label">${dateLabel}</div>
        <div style="font-size:0.72rem;color:#9CA3AF;margin-top:2px">${dateStr}</div>
      </div>
      <div class="slots-tags">${chips}</div>
      <button class="del-btn" onclick="deleteDate('${dateStr}')">削除</button>
    `;
    container.appendChild(row);
  });
}

async function deleteDate(dateStr) {
  if (!confirm(`${dateStr} の空き枠をすべて削除しますか？\n※ 既存の予約は取り消されません`)) return;
  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/slots`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': ADMIN_PIN },
      body: JSON.stringify({ classroom: CLASSROOM, date: dateStr }),
    });
    const data = await res.json();
    if (data.success) { showToast('削除しました'); await loadSlots(); }
    else throw new Error(data.error);
  } catch(e) { showToast('エラー: ' + e.message); }
}

// ===== 予約読み込み =====
async function loadBookings() {
  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/list?classroom=${CLASSROOM}`, {
      headers: { 'X-Admin-Pin': ADMIN_PIN }
    });
    const data = await res.json();
    allBookings = data.bookings || [];
    renderBookings();
  } catch(e) {
    document.getElementById('bookingsList').innerHTML =
      '<div style="color:#EF4444;text-align:center;padding:20px">読み込みに失敗しました</div>';
  }
}

function filterBookings(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBookings();
}

function renderBookings() {
  const today = new Date(); today.setHours(0,0,0,0);
  let list = [...allBookings];

  if (currentFilter === 'upcoming') {
    list = list.filter(b => b.status !== 'cancelled' && new Date(b.date) >= today);
  } else if (currentFilter === 'past') {
    list = list.filter(b => b.status !== 'cancelled' && new Date(b.date) < today);
  } else if (currentFilter === 'cancelled') {
    list = list.filter(b => b.status === 'cancelled');
  }

  list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  const container = document.getElementById('bookingsList');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state">該当する予約はありません</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(booking => {
    const card = document.createElement('div');
    card.className = 'booking-card';
    const d = new Date(booking.date);
    const jaDow = ['日','月','火','水','木','金','土'];
    const endTime = addMinutes(booking.time, 60);
    card.innerHTML = `
      <div class="booking-header">
        <div>
          <div class="booking-name">${booking.studentName} 様</div>
          <div class="booking-id-small">予約番号: ${booking.bookingId}</div>
        </div>
        <span class="status-badge ${booking.status === 'cancelled' ? 'cancelled' : 'confirmed'}">
          ${booking.status === 'cancelled' ? 'キャンセル' : '予約確定'}
        </span>
      </div>
      <div class="booking-datetime">
        📅 ${d.getMonth()+1}月${d.getDate()}日（${jaDow[d.getDay()]}）　🕐 ${booking.time}〜${endTime}（60分）
      </div>
      ${booking.memo ? `<div class="booking-memo">💬 ${booking.memo}</div>` : ''}
      ${booking.status !== 'cancelled' ? `
        <div class="booking-actions">
          <button class="cancel-btn" onclick="cancelBooking('${booking.bookingId}')">キャンセルする</button>
        </div>
      ` : ''}
    `;
    container.appendChild(card);
  });
}

async function cancelBooking(bookingId) {
  if (!confirm(`予約番号 ${bookingId} をキャンセルしますか？`)) return;
  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/cancel`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': ADMIN_PIN },
      body: JSON.stringify({ classroom: CLASSROOM, bookingId }),
    });
    const data = await res.json();
    if (data.success) {
      showToast('キャンセルしました');
      await Promise.all([loadBookings(), loadSlots()]);
    } else throw new Error(data.error);
  } catch(e) { showToast('エラー: ' + e.message); }
}

// ===== タブ切り替え =====
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['slots','bookings'][i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach((p,i) => {
    p.classList.toggle('active', ['slots','bookings'][i] === name);
  });
  if (name === 'bookings') loadBookings();
}

// ===== ユーティリティ =====
function addMinutes(timeStr, mins) {
  const [h, m] = timeStr.split(':').map(Number);
  const total = h * 60 + m + mins;
  return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== 受付状態 =====
let bookingOpen = false;

async function loadStatus() {
  try {
    const res = await fetch(`${WORKER_URL}/booking/status?classroom=${CLASSROOM}`, {
      headers: { 'X-Admin-Pin': ADMIN_PIN }
    });
    const data = await res.json();
    bookingOpen = !!data.open;
    renderSwitch();
  } catch(e) {
    document.getElementById('statusDesc').textContent = '状態の取得に失敗しました';
  }
}

function renderSwitch() {
  const track = document.getElementById('switchTrack');
  const thumb = document.getElementById('switchThumb');
  const label = document.getElementById('statusLabel');
  const desc  = document.getElementById('statusDesc');
  if (bookingOpen) {
    track.style.background = '#10B981';
    thumb.style.left = '25px';
    label.textContent = 'ON';
    label.style.color = '#10B981';
    desc.textContent = '受付中 ― 保護者が予約できます';
  } else {
    track.style.background = '#D1D5DB';
    thumb.style.left = '3px';
    label.textContent = 'OFF';
    label.style.color = 'var(--gray)';
    desc.textContent = '受付停止中 ― 保護者画面は閉鎖されています';
  }
}

async function toggleStatus() {
  const next = !bookingOpen;
  try {
    const res = await fetch(`${WORKER_URL}/booking/admin/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': ADMIN_PIN },
      body: JSON.stringify({ classroom: CLASSROOM, open: next }),
    });
    const data = await res.json();
    if (data.success) {
      bookingOpen = next;
      renderSwitch();
      showToast(next ? '✅ 予約受付を開始しました' : '🔒 予約受付を停止しました');
    } else throw new Error(data.error);
  } catch(e) {
    showToast('エラー: ' + e.message);
  }
}
</script>
